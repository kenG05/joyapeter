<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Joya Peter | Catálogo Exclusivo</title>
    <!-- Estilos CSS -->
    <link rel="stylesheet" href="styles.css">
    <!-- Fuentes Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    
    <!-- SDK de Firebase (Compatibilidad) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body>

    <!-- Encabezado / Logo -->
    <header class="header-principal">
        <div class="logo-container">
            <h1 class="logo-texto">JOYA PETER</h1>
            <p class="slogan">Importaciones & Joyería Fina</p>
        </div>
    </header>

    <!-- Banner de Bienvenida -->
    <section class="hero-banner">
        <h2>Colección Exclusiva</h2>
        <p>Explora nuestro catálogo en tiempo real y consulta directamente por WhatsApp.</p>
    </section>

    <!-- Contenedor del Catálogo -->
    <main class="contenedor-main">
        <div id="contenedor-productos" class="grid-productos">
            <p class="cargando">Cargando catálogo exclusivo...</p>
        </div>
    </main>

    <!-- Pie de página -->
    <footer class="footer-principal">
        <p>&copy; 2026 Joya Peter. Todos los derechos reservados.</p>
        <a href="admin.html" class="link-admin-oculto">Acceso Administración</a>
    </footer>

    <!-- Lógica JavaScript -->
    <script src="script.js"></script>
</body>
</html>
