<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración | Joya Peter</title>
    <!-- Estilos CSS -->
    <link rel="stylesheet" href="styles.css">
    <!-- Fuentes Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <!-- SDK de Firebase (Compatibilidad) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body>

    <header class="header-admin">
        <div class="logo-container">
            <h1 class="logo-texto">JOYA PETER</h1>
            <span class="badge-admin">Panel de Administración</span>
        </div>
        <a href="index.html" class="btn-volver">← Ver Catálogo Público</a>
    </header>

    <main class="contenedor-admin">
        <!-- Formulario para agregar productos -->
        <section class="card-admin">
            <h2>Agregar Nueva Joya</h2>
            <form id="form-producto">
                <div class="campo">
                    <label for="nombre">Nombre de la Joya:</label>
                    <input type="text" id="nombre" placeholder="Ej: Anillo Solitario Oro 18K" required>
                </div>

                <div class="campo">
                    <label for="precio">Precio (CLP):</label>
                    <input type="number" id="precio" placeholder="Ej: 45000" required>
                </div>

                <div class="campo">
                    <label for="categoria">Categoría:</label>
                    <select id="categoria" required>
                        <option value="Anillos">Anillos</option>
                        <option value="Cadenas">Cadenas</option>
                        <option value="Pulseras">Pulseras</option>
                        <option value="Aritos">Aritos / Caravanas</option>
                        <option value="Relojes">Relojes</option>
                        <option value="Otros">Otros</option>
                    </select>
                </div>

                <div class="campo">
                    <label for="imagen">URL de la Imagen (Enlace):</label>
                    <input type="url" id="imagen" placeholder="Ej: https://midominio.com/foto.jpg" required>
                </div>

                <div class="campo">
                    <label for="descripcion">Descripción del producto:</label>
                    <textarea id="descripcion" rows="3" placeholder="Detalles de materiales, medidas, etc."></textarea>
                </div>

                <button type="submit" class="btn-guardar">Guardar Joya en la Nube</button>
            </form>
        </section>

        <!-- Lista de productos existentes -->
        <section class="card-admin">
            <h2>Inventario en Tiempo Real</h2>
            <div id="lista-admin-productos" class="lista-admin">
                <p class="cargando">Cargando inventario...</p>
            </div>
        </section>
    </main>

    <!-- Lógica JavaScript -->
    <script src="script.js"></script>
</body>
</html>
